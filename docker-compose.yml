services:
  web:
    build:
      context: .
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.m.daocloud.io}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    environment:
      PORT: 8080
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      MODEL_CHAT_API_URL: ${MODEL_CHAT_API_URL}
      MODEL_CHAT_API_KEY: ${MODEL_CHAT_API_KEY}
      VIDEO_PARSER_AK: ${VIDEO_PARSER_AK}
    ports:
      - "8080:8080"
    restart: unless-stopped
